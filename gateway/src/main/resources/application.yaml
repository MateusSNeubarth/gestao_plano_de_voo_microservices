server:
  port: 8765
spring:
  application:
    name: gateway
  webflux:
    problemdetails:
      enabled: true
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - id: gestao-voo
              uri: lb://gestao-voo
              predicates:
                - Path=/gestao/**
              filters:
                - RewritePath=/gestao/?(?<rest>.*), /api/$\{rest}
            - id: malha-aerea
              uri: lb://malha-aerea
              predicates:
                - Path=/malha/**
              filters:
                - RewritePath=/malha/?(?<rest>.*), /api/$\{rest}
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${SERVICE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info
