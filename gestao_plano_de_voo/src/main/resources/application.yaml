server:
  port: 8080

spring:
  application:
    name: gestao-voo
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # IP e id aleatório: réplicas do mesmo serviço (docker compose --scale) aparecem como instâncias distintas no Eureka
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# chamadas ao malha-aerea: somadas por leitura de plano (uma por aerovia), precisam ficar abaixo do response-timeout de 5s do gateway
malha:
  timeout:
    connect: ${MALHA_CONNECT_TIMEOUT:1s}
    read: ${MALHA_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
